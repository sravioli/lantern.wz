---
name: files
run-name: Check text files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Prettier fails on a file it cannot parse, so this also catches syntax
      # errors in JSON and YAML.
      - name: Check Markdown, JSON, and YAML
        run: npx --yes prettier@3.9.10 --check "**/*.{md,json,jsonc,yml,yaml}"

      - name: Check TOML
        run: git ls-files -z '*.toml' | xargs -0 -r npx --yes @taplo/cli@0.7.0 fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"

      - name: Lint YAML
        run: pipx run --spec yamllint==1.38.0 yamllint --strict .

      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      # Checks every tracked text file against .editorconfig. CHANGELOG.md is
      # generated by cog. The docker image avoids the npm wrapper, which
      # downloads the binary through the unauthenticated GitHub API and hits
      # its rate limit.
      - name: Check EditorConfig
        run: >-
          git ls-files -z | grep -zv '^CHANGELOG.md$'
          | xargs -0 docker run --rm -v "$PWD:/check" --workdir /check
          mstruebing/editorconfig-checker:4.0.2 /usr/bin/editorconfig-checker

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
